services:
  db:
    image: postgres:16-alpine
    container_name: payments_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments_pass
      POSTGRES_DB: payments_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - payments_net

  postgrest:
    image: postgrest/postgrest:v12.2.0
    container_name: payments_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://payments:payments_pass@db:5432/payments_db
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_DB_SCHEMA_CACHE_ENABLED: "false"
      PGRST_DB_MAX_ROWS: "1000"
    ports:
      - "3000:3000"
    networks:
      - payments_net

  frontend:
    build: ./frontend
    container_name: payments_front
    restart: unless-stopped
    depends_on:
      - postgrest
    ports:
      - "8080:80"
    networks:
      - payments_net

volumes:
  pg_data:

networks:
  payments_net:
    driver: bridge
